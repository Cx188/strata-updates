name: Publish automatic-update feed

on:
  pull_request:
    branches: [main]
    paths:
      - release-request.json
      - .github/workflows/publish.yml
  push:
    branches: [main]
    paths: [release-request.json]

permissions:
  contents: read

concurrency:
  group: strata-automatic-update-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read and validate release request
        id: request
        shell: bash
        run: |
          VERSION="$(jq -r '.version' release-request.json)"
          TAG="$(jq -r '.tag' release-request.json)"
          SOURCE_SHA="$(jq -r '.sourceSha' release-request.json)"

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TAG" == "v$VERSION" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    if: github.event_name != 'pull_request'
    needs: prepare
    environment: production-release
    timeout-minutes: 45
    strategy:
      # Preserve results from the other operating systems when one runner has
      # an infrastructure or CDN failure.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out private source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Cx188/strata-luncher
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.STRATA_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
          path: source

      - name: Require source revision from private main
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git -C source merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - run: npm ci
        working-directory: source

      - run: npm run ci:prepare
        working-directory: source

      - name: Apply release version
        run: node scripts/set-release-version.mjs --version "${{ needs.prepare.outputs.version }}"
        working-directory: source

      - run: npm run typecheck
        working-directory: source

      - run: npm run lint
        working-directory: source

      - run: npm run test
        working-directory: source

      - name: Build installers and update metadata
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-vite build && npx electron-builder --${{ matrix.platform }} --publish never
        working-directory: source

      - name: Collect technical release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            source/release/Strata-Windows-Setup-*.exe
            source/release/Strata-Windows-Setup-*.exe.blockmap
            source/release/Strata-macOS-Universal-*.dmg
            source/release/Strata-macOS-Universal-*.zip
            source/release/Strata-macOS-Universal-*.zip.blockmap
            source/release/Strata-Linux-x86_64-*.AppImage
            source/release/latest*.yml

  publish:
    if: github.event_name != 'pull_request'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Check out public metadata from the private source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Cx188/strata-luncher
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.STRATA_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source-metadata

      - name: Create signed release manifest and checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          UPDATE_SIGNING_KEY: ${{ secrets.STRATA_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY"
          WINDOWS="release/Strata-Windows-Setup-$RELEASE_VERSION.exe"
          MACOS="release/Strata-macOS-Universal-$RELEASE_VERSION.zip"
          LINUX="release/Strata-Linux-x86_64-$RELEASE_VERSION.AppImage"
          test -f "$WINDOWS" && test -f "$MACOS" && test -f "$LINUX"

          asset_json() {
            local file="$1"
            jq -n \
              --arg name "$(basename "$file")" \
              --arg sha512 "$(openssl dgst -sha512 -binary "$file" | openssl base64 -A)" \
              --argjson size "$(stat -c '%s' "$file")" \
              '{name: $name, sha512: $sha512, size: $size}'
          }

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg issuedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson win32 "$(asset_json "$WINDOWS")" \
            --argjson darwin "$(asset_json "$MACOS")" \
            --argjson linux "$(asset_json "$LINUX")" \
            '{schemaVersion: 1, version: $version, tag: $tag, sourceSha: $sourceSha, issuedAt: $issuedAt, assets: {win32: $win32, darwin: $darwin, linux: $linux}}' \
            > release/strata-release.json

          KEY_FILE="$RUNNER_TEMP/strata-update-signing-key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          openssl pkeyutl -sign -rawin -inkey "$KEY_FILE" \
            -in release/strata-release.json -out release/strata-release.sig
          openssl pkeyutl -verify -rawin -pubin \
            -inkey <(openssl pkey -in "$KEY_FILE" -pubout) \
            -in release/strata-release.json -sigfile release/strata-release.sig
          (cd release && sha256sum * > SHA256SUMS)
          openssl pkeyutl -sign -rawin -inkey "$KEY_FILE" \
            -in release/SHA256SUMS -out release/SHA256SUMS.sig
          openssl pkeyutl -verify -rawin -pubin \
            -inkey <(openssl pkey -in "$KEY_FILE" -pubout) \
            -in release/SHA256SUMS -sigfile release/SHA256SUMS.sig

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*

      - name: Publish technical update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Cx188/strata-updates
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          NEWS_JSON="$(curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
            --user-agent 'Strata-Release/1.0 (+https://stratamc.net)' \
            "https://api.stratamc.net/v1/news?release=$RELEASE_VERSION" || printf '[]')"
          NEWS_BODY="$(jq -r '
            if length == 0 then
              "### Strata update\n\nThis release includes launcher improvements and fixes."
            else
              map("### " + .title + "\n\n" + .body) | join("\n\n")
            end
          ' <<<"$NEWS_JSON")"
          cat > release-notes.md <<EOF
          ## What's new

          $NEWS_BODY
          EOF

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Strata $RELEASE_VERSION update feed" \
              --notes-file release-notes.md
          elif [[ "$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .draft)" != "true" ]]; then
            echo "Release $RELEASE_TAG is already published and immutable."
            exit 0
          fi

          for asset in release/*; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done
          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Request clean player release
        env:
          DISTRIBUTION_DEPLOY_KEY: ${{ secrets.STRATA_DISTRIBUTION_DEPLOY_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          KEY_FILE="$RUNNER_TEMP/strata-distribution-key"
          trap 'rm -f "$KEY_FILE"' EXIT
          test -n "$DISTRIBUTION_DEPLOY_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DISTRIBUTION_DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          git clone git@github.com:Cx188/strata.git distribution
          mkdir -p distribution/assets
          cp source-metadata/install.ps1 distribution/install.ps1
          cp source-metadata/install.sh distribution/install.sh
          cp source-metadata/src/main/icon.png distribution/assets/strata.png
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg requestedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, tag: $tag, sourceSha: $sourceSha, requestedAt: $requestedAt}' \
            > distribution/release-request.json

          git -C distribution config user.name "Strata Release Bot"
          git -C distribution config user.email "119851863+Cx188@users.noreply.github.com"
          git -C distribution add \
            release-request.json \
            install.ps1 \
            install.sh \
            assets/strata.png
          git -C distribution commit -m "release: request $RELEASE_TAG"
          git -C distribution push origin main
